apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker7stage-v1
  labels:
    app: docker7stage-v1
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docker7stage-v1
  template:
    metadata:
      labels:
        app: docker7stage-v1
        version: v1
    spec:
      containers:
        - name: docker7stage
          image: DOCKERHUB_USERNAME/docker7stage:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
